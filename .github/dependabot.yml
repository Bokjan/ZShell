# Weekly dependency updates. Minor and patch updates are grouped into one pull request per
# ecosystem; major updates (including 0.x minor bumps for Cargo) get their own. Tauri's npm
# packages and crates are released together, so each side groups them separately. Dependabot
# puts a dependency in the group whose rule fits it most closely, and counts a group without
# patterns as closer than a wildcard, so minor-and-patch leaves out the named groups' packages.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      tauri:
        patterns: ["@tauri-apps/*"]
      xterm:
        patterns: ["@xterm/*"]
      minor-and-patch:
        update-types: [minor, patch]
        exclude-patterns: ["@tauri-apps/*", "@xterm/*"]
    ignore:
      # React Compiler doesn't compile parameters with defaults under Babel 8 (react/react#36868,
      # see docs/TODO.md).
      - dependency-name: "@babel/core"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      tauri:
        patterns: ["tauri", "tauri-*"]
      russh:
        patterns: ["russh", "russh-*"]
      minor-and-patch:
        update-types: [minor, patch]
        exclude-patterns: ["tauri", "tauri-*", "russh", "russh-*"]
    ignore:
      # They must be the versions `windows` itself depends on (`#[implement]` mixes their types), so
      # they are bumped by hand along with it.
      - dependency-name: windows-core
      - dependency-name: windows-future
      # zbus 6 drops the blocking API, and keyring and the Tauri plugins still use zbus 5; we move
      # once they do (see docs/TODO.md).
      - dependency-name: zbus
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]
    ignore:
      # Breaks pnpm on Windows (see docs/TODO.md); a later version is tried, and CI checks that
      # pnpm runs.
      - dependency-name: pnpm/action-setup
        versions: ["6.1.0"]
