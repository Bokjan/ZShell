# Weekly dependency updates. Minor and patch updates are grouped into one pull request per
# ecosystem; major updates (including 0.x minor bumps for Cargo) get their own. Tauri's npm
# packages and crates are released together, so each side groups them separately.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      tauri:
        patterns: ["@tauri-apps/*"]
      xterm:
        patterns: ["@xterm/*"]
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      tauri:
        patterns: ["tauri", "tauri-*"]
      russh:
        patterns: ["russh", "russh-*"]
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # They must be the versions `windows` itself depends on (`#[implement]` mixes their types), so
      # they are bumped by hand along with it.
      - dependency-name: windows-core
      - dependency-name: windows-future

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]
    ignore:
      # Breaks pnpm on Windows (see docs/TODO.md); a later version is tried, and CI checks that
      # pnpm runs.
      - dependency-name: pnpm/action-setup
        versions: ["6.1.0"]
