# Builds the macOS, Windows and Linux packages; only when run by hand (`scripts/release.sh publish`),
# since version tags are also pushed for versions that are not released.
# - Run on a tag vX.Y.Z (matching the version in src-tauri/Cargo.toml), it creates a draft
#   GitHub release with the packages attached and, as its notes, the sections of
#   CHANGELOG.md for every version since the previous published release
#   (scripts/release-notes.sh); publish it by hand after checking it.
# - Run on a branch, it only builds, and attaches the packages to the run as workflow
#   artifacts.
# The Microsoft Store bundle is never attached to the release: it is unsigned, and only the
# Store, which signs it on submission, can install it. It is always a workflow artifact,
# uploaded to Partner Center by hand. "Microsoft Store only" skips the other packages, and
# so creates no release.
name: Release

on:
  workflow_dispatch:
    inputs:
      store_only:
        description: Microsoft Store only
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  create-release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.release.outputs.id }}
    steps:
      - uses: actions/checkout@v7
      - name: Check that the tag matches the app version
        run: |
          version=$(grep -m1 '^version = ' src-tauri/Cargo.toml | cut -d '"' -f 2)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $version in src-tauri/Cargo.toml"
            exit 1
          fi
      # Every version's section since the previous published release, since not every
      # version is released.
      - name: Read the release notes from CHANGELOG.md
        if: ${{ !inputs.store_only }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! scripts/release-notes.sh "${GITHUB_REF_NAME#v}" > "$RUNNER_TEMP/notes.md" || [ ! -s "$RUNNER_TEMP/notes.md" ]; then
            echo "::error::Could not read the release notes for $GITHUB_REF_NAME from CHANGELOG.md"
            exit 1
          fi
      # Created once here, so the parallel build jobs upload into the same release instead
      # of racing to create it.
      - name: Create a draft release
        if: ${{ !inputs.store_only }}
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases" \
            -f tag_name="$GITHUB_REF_NAME" -f name="ZShell $GITHUB_REF_NAME" \
            -f body="$(cat "$RUNNER_TEMP/notes.md")" -F draft=true --jq .id)
          echo "id=$id" >> "$GITHUB_OUTPUT"

  macos:
    needs: create-release
    # Also runs when create-release was skipped (manual runs).
    if: ${{ !failure() && !cancelled() && !inputs.store_only }}
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      # A cache saved on a tag is only visible to runs on that same tag, so never reused.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          save-if: ${{ !startsWith(github.ref, 'refs/tags/') }}
      # Third-party license notices, which the frontend build embeds; fails without
      # cargo-about rather than leaving out the Rust crates.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about
      - run: pnpm licenses:generate
      # Universal binary for Apple Silicon and Intel: .app and .dmg.
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Ad-hoc signature (no certificate) so that the downloaded bundle is consistently
          # signed; Apple Silicon refuses to run unsigned code.
          APPLE_SIGNING_IDENTITY: '-'
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: --target universal-apple-darwin
          uploadWorkflowArtifacts: ${{ !startsWith(github.ref, 'refs/tags/') }}

  # The deb and rpm packages (tauri.linux.conf.json), x64. Built on the oldest Ubuntu runner,
  # since the executable needs at least the glibc it was built with: 2.35, older than Debian
  # 12's and Fedora's.
  linux:
    needs: create-release
    if: ${{ !failure() && !cancelled() && !inputs.store_only }}
    name: Linux
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Linux libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libssl-dev libxdo-dev librsvg2-dev libdbus-1-dev
      - uses: pnpm/action-setup@v6
        with:
          version: 12
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          save-if: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about
      - run: pnpm licenses:generate
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          uploadWorkflowArtifacts: ${{ !startsWith(github.ref, 'refs/tags/') }}

  # Every Windows package but the Store bundle, from one x64 build whose executable is also
  # the one in the Store bundle:
  # - NSIS installer (-setup.exe) and MSI.
  # - The bare executable, runnable without installing (needs the WebView2 runtime, which
  #   Windows 11 and up-to-date Windows 10 include).
  windows-x64:
    needs: create-release
    if: ${{ !failure() && !cancelled() }}
    name: Windows x64
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      # A cache saved on a tag is only visible to runs on that same tag, so never reused.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          save-if: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about
      - run: pnpm licenses:generate
      - run: pnpm tauri build --target x86_64-pc-windows-msvc ${{ inputs.store_only && '--no-bundle' || '' }}
      # For the msix job; only lives as long as the run needs it.
      - uses: actions/upload-artifact@v7
        with:
          name: zshell-x64
          path: src-tauri/target/x86_64-pc-windows-msvc/release/zshell.exe
          retention-days: 1
      # Outside the checkout: dist/ there is the frontend build.
      - name: Collect the packages
        if: ${{ !inputs.store_only }}
        env:
          PACKAGES: ${{ runner.temp }}/packages
        run: |
          $version = (Select-String -Path src-tauri/Cargo.toml -Pattern '^version = "(.+)"' |
            Select-Object -First 1).Matches[0].Groups[1].Value
          $release = "src-tauri/target/x86_64-pc-windows-msvc/release"
          New-Item -ItemType Directory -Path $env:PACKAGES | Out-Null
          Copy-Item "$release/bundle/nsis/*-setup.exe", "$release/bundle/msi/*.msi" $env:PACKAGES
          Copy-Item "$release/zshell.exe" "$env:PACKAGES/ZShell_${version}_x64_standalone.exe"
          Get-ChildItem $env:PACKAGES | ForEach-Object Name
      - name: Upload to the release
        if: ${{ startsWith(github.ref, 'refs/tags/') && !inputs.store_only }}
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGES: ${{ runner.temp }}/packages
        run: gh release upload "$env:GITHUB_REF_NAME" (Get-ChildItem $env:PACKAGES)
      - uses: actions/upload-artifact@v7
        if: ${{ !startsWith(github.ref, 'refs/tags/') && !inputs.store_only }}
        with:
          name: Windows
          path: ${{ runner.temp }}/packages/*

  # The ARM64 executable for the Store bundle, built natively in parallel with x64 (cross-
  # compiling it after x64 on one runner doubled the job's time). ring needs clang for
  # ARM64, which the runner image includes.
  windows-arm64:
    needs: create-release
    if: ${{ !failure() && !cancelled() }}
    name: Windows ARM64
    runs-on: windows-11-arm
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          save-if: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about
      - run: pnpm licenses:generate
      - run: pnpm tauri build --no-bundle --target aarch64-pc-windows-msvc
      - uses: actions/upload-artifact@v7
        with:
          name: zshell-arm64
          path: src-tauri/target/aarch64-pc-windows-msvc/release/zshell.exe
          retention-days: 1

  # The Microsoft Store bundle (x64 and ARM64), only as a workflow artifact.
  msix:
    needs: [windows-x64, windows-arm64]
    # A skipped create-release would otherwise skip this job too.
    if: ${{ !failure() && !cancelled() }}
    name: Microsoft Store
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
      # Where scripts/package-msix.ps1 looks for the executables.
      - uses: actions/download-artifact@v7
        with:
          name: zshell-x64
          path: src-tauri/target/x86_64-pc-windows-msvc/release
      - uses: actions/download-artifact@v7
        with:
          name: zshell-arm64
          path: src-tauri/target/aarch64-pc-windows-msvc/release
      - run: scripts/package-msix.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: Microsoft Store
          path: src-tauri/target/msix/*.msixbundle
