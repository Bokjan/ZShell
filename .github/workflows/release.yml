# Builds the macOS and Windows packages.
# - Pushing a tag vX.Y.Z (matching the version in src-tauri/Cargo.toml) creates a draft
#   GitHub release with all packages attached and the version's section of CHANGELOG.md as
#   its notes; publish it by hand after checking it.
# - Running the workflow by hand only builds, and attaches the packages to the run as
#   workflow artifacts.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.release.outputs.id }}
    steps:
      - uses: actions/checkout@v7
      - name: Check that the tag matches the app version
        run: |
          version=$(grep -m1 '^version = ' src-tauri/Cargo.toml | cut -d '"' -f 2)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $version in src-tauri/Cargo.toml"
            exit 1
          fi
      - name: Read the release notes from CHANGELOG.md
        run: |
          version=${GITHUB_REF_NAME#v}
          # The lines after the "## [X.Y.Z]" heading, up to the next version's heading.
          awk -v heading="## [$version]" '
            /^## \[/ { if (found) exit; found = index($0, heading) == 1; next }
            found' CHANGELOG.md | sed '/./,$!d' > "$RUNNER_TEMP/notes.md"
          if [ ! -s "$RUNNER_TEMP/notes.md" ]; then
            echo "::error::CHANGELOG.md has no section for $version"
            exit 1
          fi
      # Created once here, so the parallel build jobs upload into the same release instead
      # of racing to create it.
      - name: Create a draft release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases" \
            -f tag_name="$GITHUB_REF_NAME" -f name="ZShell $GITHUB_REF_NAME" \
            -f body="$(cat "$RUNNER_TEMP/notes.md")" -F draft=true --jq .id)
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    needs: create-release
    # Also runs when create-release was skipped (manual runs).
    if: ${{ !failure() && !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Universal binary for Apple Silicon and Intel: .app and .dmg.
          - name: macOS
            os: macos-latest
            args: --target universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          # NSIS installer (-setup.exe) and MSI.
          - name: Windows
            os: windows-latest
            args: ''
          # The bare executable, runnable without installing (needs the WebView2 runtime,
          # which Windows 11 and up-to-date Windows 10 include).
          - name: Windows standalone
            os: windows-latest
            args: --no-bundle
            standalone: true
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.name }}
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Ad-hoc signature (no certificate) so that the downloaded bundle is consistently
          # signed; Apple Silicon refuses to run unsigned code. Ignored on Windows.
          APPLE_SIGNING_IDENTITY: '-'
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}
          uploadPlainBinary: ${{ matrix.standalone == true }}
          # The plain binary's [name] is "binary", so the app name is spelled out.
          releaseAssetNamePattern: ${{ matrix.standalone && 'ZShell_[version]_[arch]_standalone[ext]' || '' }}
          uploadWorkflowArtifacts: ${{ github.event_name == 'workflow_dispatch' }}

  # The Microsoft Store bundle (x64 and ARM64), uploaded to Partner Center by hand.
  store:
    needs: create-release
    if: ${{ !failure() && !cancelled() }}
    name: Microsoft Store
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc,aarch64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: Microsoft Store
      # Cross-compiled on the x64 runner; ring needs clang for ARM64, which the runner
      # image includes.
      - run: pnpm tauri build --no-bundle --target x86_64-pc-windows-msvc
      - run: pnpm tauri build --no-bundle --target aarch64-pc-windows-msvc
      - run: scripts/package-msix.ps1
        shell: pwsh
      - name: Upload to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$env:GITHUB_REF_NAME" (Get-Item src-tauri/target/msix/*.msixbundle)
        shell: pwsh
      - uses: actions/upload-artifact@v7
        if: github.event_name == 'workflow_dispatch'
        with:
          name: Microsoft Store
          path: src-tauri/target/msix/*.msixbundle
