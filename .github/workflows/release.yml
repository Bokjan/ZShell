# Builds the macOS, Windows and Linux packages; only when run by hand (`scripts/release.sh publish`),
# since version tags are also pushed for versions that are not released.
# - Run on a tag vX.Y.Z (matching the version in src-tauri/Cargo.toml) whose commit passed
#   CI, it creates a draft GitHub release with the packages attached and, as its notes, the
#   sections of CHANGELOG.md for every version since the previous published release
#   (scripts/release-notes.sh); publish it by hand after checking it.
# - Run on a branch, it only builds.
# Either way, the packages are also attached to the run as workflow artifacts.
# The Microsoft Store bundle is never attached to the release: it is unsigned, and only the
# Store, which signs it on submission, can install it. It is always a workflow artifact,
# uploaded to Partner Center by hand. "Microsoft Store only" skips the other packages, and
# so creates no release.
#
# Only the last job, which creates the release from the workflow artifacts, can write to
# the repository: the build jobs run third-party code (actions, build scripts) with a
# read-only token. Actions are pinned to a commit (Dependabot updates the hash and the
# version comment), so that a moved tag can't change what runs.
name: Release

on:
  workflow_dispatch:
    inputs:
      store_only:
        description: Microsoft Store only
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # Fails early, before the builds, on what would stop the release at the end.
  check:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    # Waits for CI on the tag's commit, which takes well under this.
    timeout-minutes: 90
    permissions:
      contents: read
      # To find the CI run of the tag's commit.
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check that the tag matches the app version
        run: |
          version=$(grep -m1 '^version = ' src-tauri/Cargo.toml | cut -d '"' -f 2)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $version in src-tauri/Cargo.toml"
            exit 1
          fi
      - name: Check that the release notes can be read from CHANGELOG.md
        if: ${{ !inputs.store_only }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! scripts/release-notes.sh "${GITHUB_REF_NAME#v}" > /dev/null; then
            echo "::error::Could not read the release notes for $GITHUB_REF_NAME from CHANGELOG.md"
            exit 1
          fi
      # The build jobs don't run the tests. The tag's commit is normally pushed to main with
      # it, which runs CI; waits for that run if it is still going.
      - name: Check that CI passed on the tag's commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [ -z "$run" ]; then
            echo "::error::CI has not run on $GITHUB_SHA; push it to main first: git push origin main $GITHUB_REF_NAME"
            exit 1
          fi
          if ! gh run watch "$run" --repo "$GITHUB_REPOSITORY" --exit-status --interval 30 > /dev/null; then
            echo "::error::CI failed on $GITHUB_SHA: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$run"
            exit 1
          fi

  macos:
    needs: check
    # Also runs when check was skipped (runs on a branch).
    if: ${{ !failure() && !cancelled() && !inputs.store_only }}
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 12
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: "1.99.0"
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      # A cache saved on a tag is only visible to runs on that same tag, so never reused.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          save-if: ${{ !startsWith(github.ref, 'refs/tags/') }}
      # Third-party license notices, which the frontend build embeds; fails without
      # cargo-about rather than leaving out the Rust crates.
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-about
      - run: pnpm licenses:generate
      # Universal binary for Apple Silicon and Intel: .app and .dmg.
      - run: pnpm tauri build --target universal-apple-darwin
        env:
          # Ad-hoc signature (no certificate) so that the downloaded bundle is consistently
          # signed; Apple Silicon refuses to run unsigned code.
          APPLE_SIGNING_IDENTITY: "-"
      # The .app is a directory: archived with tar, since a workflow artifact (a zip) would
      # lose the executable's permissions and the bundle's symlinks.
      - name: Collect the packages
        env:
          PACKAGES: ${{ runner.temp }}/packages
        run: |
          version=$(grep -m1 '^version = ' src-tauri/Cargo.toml | cut -d '"' -f 2)
          bundle=src-tauri/target/universal-apple-darwin/release/bundle
          mkdir -p "$PACKAGES"
          cp "$bundle"/dmg/*.dmg "$PACKAGES"
          tar -czf "$PACKAGES/ZShell_${version}_universal.app.tar.gz" -C "$bundle/macos" ZShell.app
          ls "$PACKAGES"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macOS
          path: ${{ runner.temp }}/packages/*

  # The deb and rpm packages (tauri.linux.conf.json), x64. Built on the oldest Ubuntu runner,
  # since the executable needs at least the glibc it was built with: 2.35, older than Debian
  # 12's and Fedora's.
  linux:
    needs: check
    if: ${{ !failure() && !cancelled() && !inputs.store_only }}
    name: Linux
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Linux libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libssl-dev libxdo-dev librsvg2-dev libdbus-1-dev
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 12
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: "1.99.0"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          save-if: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-about
      - run: pnpm licenses:generate
      - run: pnpm tauri build
      # Into one folder: an artifact of several paths keeps them under their common ancestor
      # (deb/, rpm/), and the release job uploads only files.
      - name: Collect the packages
        env:
          PACKAGES: ${{ runner.temp }}/packages
        run: |
          bundle=src-tauri/target/release/bundle
          mkdir -p "$PACKAGES"
          cp "$bundle"/deb/*.deb "$bundle"/rpm/*.rpm "$PACKAGES"
          ls "$PACKAGES"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Linux
          path: ${{ runner.temp }}/packages/*

  # Every Windows package but the Store bundle, from one x64 build whose executable is also
  # the one in the Store bundle:
  # - NSIS installer (-setup.exe) and MSI.
  # - The bare executable, runnable without installing (needs the WebView2 runtime, which
  #   Windows 11 and up-to-date Windows 10 include).
  windows-x64:
    needs: check
    if: ${{ !failure() && !cancelled() }}
    name: Windows x64
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 12
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: "1.99.0"
          targets: x86_64-pc-windows-msvc
      # A cache saved on a tag is only visible to runs on that same tag, so never reused.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          save-if: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-about
      - run: pnpm licenses:generate
      - run: pnpm tauri build --target x86_64-pc-windows-msvc ${{ inputs.store_only && '--no-bundle' || '' }}
      # For the msix job; only lives as long as the run needs it.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zshell-x64
          path: src-tauri/target/x86_64-pc-windows-msvc/release/zshell.exe
          retention-days: 1
      # Outside the checkout: dist/ there is the frontend build.
      - name: Collect the packages
        if: ${{ !inputs.store_only }}
        env:
          PACKAGES: ${{ runner.temp }}/packages
        run: |
          $version = (Select-String -Path src-tauri/Cargo.toml -Pattern '^version = "(.+)"' |
            Select-Object -First 1).Matches[0].Groups[1].Value
          $release = "src-tauri/target/x86_64-pc-windows-msvc/release"
          New-Item -ItemType Directory -Path $env:PACKAGES | Out-Null
          Copy-Item "$release/bundle/nsis/*-setup.exe", "$release/bundle/msi/*.msi" $env:PACKAGES
          Copy-Item "$release/zshell.exe" "$env:PACKAGES/ZShell_${version}_x64_standalone.exe"
          Get-ChildItem $env:PACKAGES | ForEach-Object Name
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !inputs.store_only }}
        with:
          name: Windows
          path: ${{ runner.temp }}/packages/*

  # The ARM64 executable for the Store bundle, built natively in parallel with x64 (cross-
  # compiling it after x64 on one runner doubled the job's time). ring needs clang for
  # ARM64, which the runner image includes.
  windows-arm64:
    needs: check
    if: ${{ !failure() && !cancelled() }}
    name: Windows ARM64
    runs-on: windows-11-arm
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 12
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: "1.99.0"
          targets: aarch64-pc-windows-msvc
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          save-if: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-about
      - run: pnpm licenses:generate
      - run: pnpm tauri build --no-bundle --target aarch64-pc-windows-msvc
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zshell-arm64
          path: src-tauri/target/aarch64-pc-windows-msvc/release/zshell.exe
          retention-days: 1

  # The Microsoft Store bundle (x64 and ARM64), only as a workflow artifact.
  msix:
    needs: [windows-x64, windows-arm64]
    # A skipped check would otherwise skip this job too.
    if: ${{ !failure() && !cancelled() }}
    name: Microsoft Store
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Where scripts/package-msix.ps1 looks for the executables.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: zshell-x64
          path: src-tauri/target/x86_64-pc-windows-msvc/release
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: zshell-arm64
          path: src-tauri/target/aarch64-pc-windows-msvc/release
      - run: scripts/package-msix.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Microsoft Store
          path: src-tauri/target/msix/*.msixbundle

  # The draft release, with every package from the build jobs' workflow artifacts. The only
  # job that can write to the repository, and it runs no build tools or third-party actions
  # besides checkout and download-artifact.
  release:
    needs: [check, macos, linux, windows-x64]
    if: ${{ startsWith(github.ref, 'refs/tags/') && !inputs.store_only }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "{macOS,Linux,Windows}"
          path: ${{ runner.temp }}/packages
          merge-multiple: true
      # Every version's section since the previous published release, since not every
      # version is released.
      - name: Create a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGES: ${{ runner.temp }}/packages
        run: |
          ls "$PACKAGES"
          scripts/release-notes.sh "${GITHUB_REF_NAME#v}" > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --draft \
            --title "ZShell $GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md" "$PACKAGES"/*
