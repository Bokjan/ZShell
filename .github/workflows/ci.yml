# Builds and tests on every platform the app supports. Platform-only code (ConPTY, the
# OpenSSH agent pipe / Pageant on Windows, GTK on Linux) cannot be checked from another one,
# so each runs the frontend build, clippy and the tests. The runners are those the release
# builds on, so that what breaks only there shows up before a release: Windows on ARM64
# (where ring needs clang), and Ubuntu 22.04's older GTK and WebKitGTK. Intel Macs aren't
# checked apart: the code has nothing specific to the processor.
# Actions are pinned to a commit (Dependabot updates the hash and the version comment), so
# that a moved tag can't change what runs.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request replaces its run. Runs on main all finish: a release checks
# that CI passed on its commit (a group of their own, since a group keeps one pending run).
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
          - name: Windows
            os: windows-latest
          - name: Windows ARM64
            os: windows-11-arm
          - name: Linux
            os: ubuntu-22.04
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # What Tauri needs on Linux (WebKitGTK, GTK), and libdbus for Tao.
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libssl-dev libxdo-dev librsvg2-dev libdbus-1-dev
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 12
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      # pnpm/action-setup 6.1.0 left a pnpm on Windows whose commands ran nothing and still
      # succeeded under PowerShell, so the frontend build and tests passed without running.
      - name: Check that pnpm runs
        shell: pwsh
        run: |
          $version = pnpm --version
          if ($LASTEXITCODE -ne 0 -or -not $version) {
            Write-Output "::error::pnpm --version printed nothing: pnpm commands would not run"
            exit 1
          }
          Write-Output "pnpm $version"
      - run: pnpm install --frozen-lockfile
      # Formatting doesn't depend on the platform, and Windows checks out CRLF line endings,
      # which Prettier would report in every file.
      - if: runner.os == 'macOS'
        run: pnpm format:check
      # tauri::generate_context! embeds the built frontend.
      - run: pnpm build
      - run: pnpm test
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
      - name: Rustfmt
        if: runner.os == 'macOS'
        working-directory: src-tauri
        run: cargo fmt --check
      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        working-directory: src-tauri
        run: cargo test --locked

  # Known security advisories for the Rust dependencies (RustSec). Those that don't apply are
  # ignored in src-tauri/.cargo/audit.toml, each with why and when to look again.
  audit:
    name: Advisories
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-audit
      - name: Audit
        working-directory: src-tauri
        run: cargo audit

  # The third-party license notices (scripts/generate-licenses.mjs), which fail on a license
  # not accepted in src-tauri/about.toml or a stale clarification there. The release
  # workflow generates them too, but finding out there is too late. Not platform-specific,
  # so once.
  licenses:
    name: Licenses
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 12
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-about
      - run: pnpm licenses:generate
