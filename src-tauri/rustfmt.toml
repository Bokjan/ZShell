# Matches how the code was written: long lines, short constructs kept on one line. The style
# edition is fixed so that rustfmt versions (Homebrew's, CI's stable) format alike.
style_edition = "2021"
max_width = 140
use_small_heuristics = "Max"
# LF on every platform, as .gitattributes checks files out (rustfmt otherwise keeps what a file has).
newline_style = "Unix"
