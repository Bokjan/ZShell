# cargo-about configuration for the third-party license notices that ship with the app
# (scripts/generate-licenses.mjs, which reads its JSON output).

# Licenses we can comply with, in order of preference: for "MIT OR Apache-2.0" the MIT
# text is used. They allow distributing builds without their source, used for anything,
# asking at most for the notice (see "依赖的许可证" in docs/DEVELOPMENT.md).
accepted = [
    "MIT",
    "Apache-2.0",
    "BSD-3-Clause",
    "BSD-2-Clause",
    "ISC",
    "Zlib",
    "BSL-1.0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "BlueOak-1.0.0",
    "Python-2.0",
    # No conditions at all.
    "0BSD",
    "MIT-0",
    "Unlicense",
    "CC0-1.0",
    # Data and fonts. The attribution CC-BY asks for is the notice; a font under OFL isn't
    # sold on its own. Not the other Creative Commons licenses: SA, NC and ND add conditions.
    "CC-BY-4.0",
    "CC-BY-3.0",
    "CDLA-Permissive-2.0",
    "OFL-1.1",
]
# Every target a release is built for, so that the crates only one platform uses are all
# listed.
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
]
ignore-build-dependencies = true
ignore-dev-dependencies = true
# ZShell itself (publish = false).
private = { ignore = true }
# chrono puts both licenses in one file.
workarounds = ["chrono"]

# Crates whose license files cargo-about doesn't pick up because of their names
# (license-mit, LICENSE_MIT); without these it falls back to the generic MIT text, which
# lacks the copyright line. Dependabot updates keep working as long as the file is
# unchanged; a changed file makes generation fail on the checksum.
[windows.clarify]
license = "MIT OR Apache-2.0"
files = [{ path = "license-mit", license = "MIT", checksum = "c2cfccb812fe482101a8f04597dfc5a9991a6b2748266c47ac91b6a5aae15383" }]
[windows-collections.clarify]
