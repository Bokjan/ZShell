[package]
name = "zshell"
version = "1.6.3"
description = "A cross-platform SSH client"
edition = "2021"
# Proprietary (see "License" in README.md); never published to crates.io.
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "zshell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53.2", features = ["sync", "macros", "net", "time", "fs", "io-util", "process"] }
unicode-width = "0.2.2"
russh = { version = "0.64.1", default-features = false, features = ["ring", "flate2", "rsa"] }
keyring = "4.2.0"
uuid = { version = "1.27.0", features = ["v4"] }
anyhow = "1.0.104"
russh-sftp = "3.0.1"
tauri-plugin-dialog = "2.8.1"
ssh2-config = "0.8"
portable-pty = "0.9"
tauri-plugin-clipboard-manager = "2"
vte = "0.15"
chrono = "0.4"
encoding_rs = "0.8"
serialport = { version = "4.10", default-features = false }
socket2 = { version = "0.6", features = ["all"] }
# known_hosts: hashed host names (already in the tree through russh).
hmac = "0.13"
sha1 = "0.11"
data-encoding = "2"

[dev-dependencies]
tokio = { version = "1.53.2", features = ["test-util"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
windows = { version = "0.62", features = [
    "System_Profile",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_SystemServices",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
# `#[implement]` from `windows` refers to `windows_core` by name.
windows-core = "0.62"

[target.'cfg(target_os = "macos")'.dependencies]
sys-locale = "0.3.2"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = [
    "NSArray",
    "NSDictionary",
    "NSError",
    "NSGeometry",
    "NSOperation",
    "NSProcessInfo",
    "NSString",
    "NSURL",
    "NSUserDefaults",
    "NSValue",
] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "block2",
    "NSDragging",
    "NSDraggingItem",
    "NSDraggingSession",
    "NSEvent",
    "NSFilePromiseProvider",
    "NSGraphicsContext",
    "NSImage",
    "NSPasteboard",
    "NSResponder",
    "NSView",
    "NSWindow",
    "NSWorkspace",
] }
block2 = "0.6"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
