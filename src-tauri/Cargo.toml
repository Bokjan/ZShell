[package]
name = "zshell"
version = "3.0.2"
description = "A cross-platform SSH client"
edition = "2021"
# Proprietary (see "License" in README.md); never published to crates.io.
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "zshell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
tokio = { version = "1.53.2", features = ["sync", "macros", "net", "time", "fs", "io-util", "process"] }
unicode-width = "0.2.2"
russh = { version = "0.64.1", default-features = false, features = ["ring", "flate2", "rsa"] }
keyring = "4.2.0"
uuid = { version = "1.27.0", features = ["v4"] }
anyhow = "1.0.104"
russh-sftp = "3.0.1"
tauri-plugin-dialog = "2.8.1"
ssh2-config = "0.8"
portable-pty = "0.9"
tauri-plugin-clipboard-manager = "2"
vte = "0.15"
chrono = "0.4"
encoding_rs = "0.8"
serialport = { version = "4.10", default-features = false }
socket2 = { version = "0.6", features = ["all"] }
# known_hosts: hashed host names (already in the tree through russh).
hmac = "0.13"
sha1 = "0.11"
data-encoding = "2"
# Telling whether a sessions file changed between showing and importing it (already in the
# tree through russh).
sha2 = "0.11"
# ssh_config `Include` (already in the tree through ssh2-config).
glob = "0.3"
# The vault and passwords in exported files: AES-256-GCM, PBKDF2 and random keys; clearing
# keys from memory (both already in the tree through russh).
ring = "0.17.14"
zeroize = "1.9"
# TypeScript types for the frontend (`src/lib/bindings.ts`, checked and written by `cargo test`).
ts-rs = "12"
# The update check (already in the tree through tauri, without TLS): the system's TLS and
# proxy settings.
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "system-proxy", "json"] }
semver = "1"
sys-locale = "0.3.2"

[dev-dependencies]
tokio = { version = "1.53.2", features = ["test-util"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
# The window's title bar and drags out of it (already in the tree through tauri).
gtk = "0.18"
# The settings portal, polkit, logind and Mutter for the appearance and the app lock (already
# in the tree through keyring and tauri-plugin-opener).
zbus = "5"

[target.'cfg(windows)'.dependencies]
tauri-plugin-single-instance = "2"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Storage_Packaging_Appx",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_System_RemoteDesktop",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
windows = { version = "0.62", features = [
    "Security_Credentials_UI",
    "System_Profile",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_SystemServices",
    "Win32_System_WinRT",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
# `#[implement]` from `windows` refers to `windows_core` by name.
windows-core = "0.62"
# Waiting on Windows Hello (`IAsyncOperation`; already in the tree through `windows`).
windows-future = "0.3"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = [
    "NSArray",
    "NSDictionary",
    "NSDistributedNotificationCenter",
    "NSError",
    "NSGeometry",
    "NSNotification",
    "NSOperation",
    "NSProcessInfo",
    "NSString",
    "NSURL",
    "NSUserDefaults",
    "NSValue",
] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "block2",
    "libc",
    "NSApplication",
    "NSDragging",
    "NSDraggingItem",
    "NSDraggingSession",
    "NSEvent",
    "NSFilePromiseProvider",
    "NSGraphicsContext",
    "NSImage",
    "NSPasteboard",
    "NSResponder",
    "NSRunningApplication",
    "NSView",
    "NSWindow",
    "NSWorkspace",
] }
block2 = "0.6"
# The app lock: Touch ID or the login password.
objc2-local-authentication = { version = "0.3", default-features = false, features = ["std", "block2", "LAContext", "LAError"] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
