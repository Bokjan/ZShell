<!doctype html>
<!-- No spelling checks, or the corrections macOS makes with them, in any text field: what is typed
     in ZShell is host names, paths, commands and names, not prose. -->
<html lang="en" spellcheck="false">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZShell</title>
    <!-- Background before the app's CSS loads, so startup never flashes the wrong color. -->
    <style>
      html { background: #1e1e1e; }
      @media (prefers-color-scheme: light) { html { background: #ffffff; } }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
